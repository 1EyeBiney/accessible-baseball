<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Baseball Engine</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        #game-terminal { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; text-align: center; }
        #game-terminal:focus { outline: 4px solid #ff9800; border-radius: 8px; padding: 1rem; background-color: #1a1a1a; }
        button { font-size: 1.5rem; padding: 15px 30px; cursor: pointer; background-color: #ff9800; color: black; border: none; border-radius: 8px; font-weight: bold; }
        #visual-buffer { margin-top: 20px; font-size: 1.2rem; min-height: 8rem; padding: 1.5rem; background: #2a2a2a; border-radius: 8px; width: 100%; border: 1px solid #444; white-space: pre-line; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <h1>Accessible Baseball</h1>
        <button id="btn-init" autofocus>Press Enter to Initialize Engine</button>
    </div>
    
    <main id="game-terminal" tabindex="0" role="application" aria-label="Baseball Engine Main Terminal">
        <div id="visual-buffer" aria-hidden="true">Engine waiting for initialization...</div>
    </main>

    <div id="live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script src="base_state.js"></script>
    <script src="base_audio.js"></script>
    <script src="base_physics.js"></script>
    <script src="base_input.js"></script>
    <script src="base_core.js"></script>
</body>
</html>
