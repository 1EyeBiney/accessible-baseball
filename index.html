<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Baseball v1.7</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #ffffff; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        #game-terminal { width: 100%; max-width: 600px; display: none; flex-direction: column; align-items: center; text-align: center; }
        #game-terminal:focus { outline: 4px solid #ff9800; border-radius: 8px; padding: 1rem; background-color: #1a1a1a; }
        button { font-size: 1.5rem; padding: 15px 30px; cursor: pointer; background-color: #ff9800; color: black; border: none; border-radius: 8px; font-weight: bold; }
        #visual-buffer { margin-top: 20px; font-size: 1.2rem; min-height: 8rem; padding: 1.5rem; background: #2a2a2a; border-radius: 8px; width: 100%; border: 1px solid #444; white-space: pre-line; }
        #telemetry-panel { display: none; flex-direction: column; align-items: stretch; gap: 0.75rem; width: 100%; max-width: 600px; margin-top: 1rem; padding: 1rem; background: #1a1a1a; border: 2px solid #ff9800; border-radius: 8px; }
        #telemetry-panel h2 { margin: 0; font-size: 1.1rem; color: #ff9800; }
        #telemetry-panel p { margin: 0; font-size: 0.95rem; color: #ccc; }
        #telemetry-textarea { width: 100%; min-height: 14rem; font-family: Consolas, 'Courier New', monospace; font-size: 0.95rem; background: #0d0d0d; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 0.75rem; box-sizing: border-box; resize: vertical; }
        #telemetry-textarea:focus { outline: 3px solid #ff9800; }
        #telemetry-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        #telemetry-actions button { font-size: 1rem; padding: 8px 16px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <h1>Accessible Baseball</h1>
        <button id="btn-init" autofocus>Press Enter to Initialize Engine</button>
    </div>
    
    <main id="game-terminal" tabindex="0" role="application" aria-label="Baseball Engine Main Terminal">
        <div id="visual-buffer" aria-hidden="true">Engine waiting for initialization...</div>
    </main>

    <section id="telemetry-panel" aria-label="Derby Telemetry Dump">
        <h2>Derby Telemetry</h2>
        <p id="telemetry-help">The full pitch log is selected below. Press Ctrl+C to copy, or use the Download button. Press Escape to return to the game.</p>
        <textarea id="telemetry-textarea" aria-labelledby="telemetry-help" spellcheck="false" wrap="off"></textarea>
        <div id="telemetry-actions">
            <button id="telemetry-download" type="button">Download as .txt</button>
            <button id="telemetry-close" type="button">Close (Escape)</button>
        </div>
    </section>

    <div id="live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script src="base_state.js"></script>
    <script src="base_audio.js"></script>
    <script src="base_physics.js"></script>
    <script src="base_input.js"></script>
    <script src="base_core.js"></script>
</body>
</html>
